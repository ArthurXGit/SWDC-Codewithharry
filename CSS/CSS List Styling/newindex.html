<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Styling using css</title>
    <style>
        ul{
            list-style-type: "😎";
            border: 5px solid red;
            margin: 0px;
            padding: 0px;
            list-style-position: inside;
        }
    </style>
</head>
<body>
    <ul>
        <li>
            mango
        </li>
        <li>
            orange
        </li>
    </ul>
</body>
</html>
