<!-- CSS Position Property  -->
 <!-- 
in the css position property , there is a property value , which is called as : fixed position value

if we apply the property fixed , no matter how far you scroll , it will stay in that position forever once it's value is set as fix
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
    }

    .box {
        padding: 90px;
        border: 3px solid black;
    }

    .box1 {
        background-color: aquamarine;

    }

    .box2 {
        background-color: gold
    }

    .box4 {
        background-color: gold
    }

    .box5 {
        background-color: gold
    }

    .box6 {
        background-color: gold
    }

    .box7 {
        background-color: gold
    }

    .box3 {
        background-color: green;
        position: fixed;
        width: 40vw;
        left: 100px;
        height: 50vh;
        align-self: center;
    }
</style>

<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
    <div class="box box7"></div>
</body>

</html>
