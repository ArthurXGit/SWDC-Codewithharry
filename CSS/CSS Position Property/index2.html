<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
    }

    .box1 {
        margin: 5px;
        padding: 50px;
        border: 5px solid black;
        background-color: blanchedalmond;
        position: relative;
        top: 60px;
        left: 50px;
        z-index: 1;
    }

    .box2 {
        margin: 5px;
        padding: 50px;
        border: 5px solid black;
        background-color: aquamarine;
        position: relative;
        left: 5px;
    }

    /* .box3 {
        margin: 5px;
        padding: 50px;
        border: 5px solid black;
        background-color: bisque;
    }

    .box4 {
        margin: 5px;
        padding: 50px;
        border: 5px solid black;
        background-color: aquamarine;
    } */

     /* 
     note : 
     in the css , there is a property , which is the position property
     
     by default , the value of the position property is static

     we can change it into absolute , relative ...etc

     in the relative value , we can apply top , bottom , left , right and z-index.....

     z-index is basically control the z index thing , ki kon kitna uper aayega

     
     */
</style>

<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</body>

</html>
