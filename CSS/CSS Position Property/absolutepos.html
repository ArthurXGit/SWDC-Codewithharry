<!-- CSS Position Property  -->
 
<!-- 

in the absolute property , it will first search it's nearest position ancestor
because of this , agar hum isko apply karke iska top , left ... etc yeh sab apply kare toh yeh apne nearest position ancestor khojega and uske relative yeh lag jayega .....

agar koi bhi nahi mila , toh yeh html ke relative hien lag jayega....

transform , filter and perspective property exceptions h , yeh ek element ko aisa pratit karwayenge ki us particular

-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
</head>

<style>
    * {
        /* margin: 6px;
        padding: 6px; */
        /* border: 3px solid black; */
        margin: 0px;
        padding: 0px;
    }

    .box {
        padding: 90px;
        margin: 20px;
        border: 3px solid black;
        /* position: absolute; */
    }

    .box1 {
        background-color: aquamarine;
        top: 0px;
    }
    
    .box2 {
        background-color: gold;
        position : absolute;
        top : 0px;
        /* width: 500px; */
        left: 70px;
    }

    .box4 {
        background-color: gold;
    }

    .box5 {
        background-color: gold;
    }

    .box6 {
        background-color: gold;
    }

    .box7 {
        background-color: gold;
    }

    .box3 {
        background-color: gold;
    }

     .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            /* position: relative; */


            /* Exception: transform, filter, or perspective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
</style>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
        <div class="box box6"></div>
        <div class="box box7"></div>
    </div>
</body>

</html>
