<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* we can reset the css by using margin zero and padding zero */

        .box {
            border: 5px solid black;
            height: 140px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
        }



        .box1 {
            background-color: aqua;
        }

        .box2 {
            background-color: antiquewhite;
            top: 69px;
            left: 67px;
        }

        .box3 {
            background-color: bisque;
        }

        .box4 {
            background-color: blueviolet;
        }
    </style>

    <!-- 
    position property is css....

    by default , the value of this position property is static
    if the value is static , we cant apply other things like top , bottom ....etc
    -->

</head>

<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</body>

</html>
