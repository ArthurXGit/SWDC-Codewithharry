<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on CSS Selectors</title>
</head>
<style>

    .box:first-child {
        background-color: red;
    }

    .box:nth-child(5) {
        background-color: blue;
    }

    .box:last-child {
        background-color: red;
    }

    .box:nth-last-child(4) {
        background-color: aqua;
    }

    .boxes::before {
        content: "We are charlie kirk"
    }

    .boxes::after {
        content: "we are do laand trump";
    }

    ::selection {
        color: black;
    }

    .box::first-letter {
        color: red;
        font-size: 50px;
    }

    input::placeholder{
        color: blue;
        border: 2px solid red;
    }
    
</style>

<body>
    <div class="boxes">
        <div class="box">Hey i am a good boy</div>
        <div class="box">Hey i am a good boy</div>
        <div class="box">Hey i am a good boy</div>
        <div class="box">Hey i am a good boy</div>
        <div class="box">Hey i am a good boy</div>
        <div class="box">Hey i am a good boy</div>
        <div class="box">Hey i am a good boy</div>
        <input type="text" , placeholder="type ur messege here">
    </div>
</body>

</html>
