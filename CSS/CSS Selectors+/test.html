<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector Grouping Example</title>
    <style>
        /* 1. Grouping HTML element selectors */
        h1, h2 {
            color: #2c3e50;
            font-family: Arial, sans-serif;
        }

        /* 2. Grouping class selectors */
        .highlight, .alert-box {
            background-color: #ffeb3b;
            padding: 10px;
            border-left: 4px solid #fbc02d;
        }

        /* 3. Grouping mixed selectors (Tag, Class, and ID) */
        button, .btn-secondary, #special-link {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Affected by h1, h2 group -->
    <h1>Main Website Heading</h1>
    <h2>Sub-heading Section</h2>

    <p>This is a standard paragraph.</p>

    <!-- Affected by .highlight, .alert-box group -->
    <div class="highlight">
        This is a highlighted text block using a class.
    </div>

    <div class="alert-box">
        This is an alert box using a completely different class, but sharing the exact same styles!
    </div>

    <br>

    <!-- Affected by button, .btn-secondary, #special-link group -->
    <button>Click Me (Tag)</button>
    <button class="btn-secondary">Cancel (Class)</button>
    <a href="#" id="special-link">Help Link (ID)</a>

</body>
</html>
