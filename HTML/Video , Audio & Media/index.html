    <!-- 
    here , by using the vdo tag , we can add a video to the website.......
    here , src attribute refers to the path of that vdo
    height and width attribute toh aap pehle se hein jante hein
    by using the controls attribute , you can give the play and pause feature to that vdo
    kya kya feature dena h woh browser ka kaam h
    poster dene se hum vdo ke starting ma jo picture nahi rehta ... like yt ke thumbnails jaisa , waisa hein h yeh bhi......
    muted attribute ka use karke hum ek vdo ko muted hein rkh sakta hein
    and loop attribute ka use karke hum , us vdo ko loop ma chala sakte hien.... 
    and autoplay attribute ka use karke hum us vod ko autoplay ma rakh sakte hein :) -->

    <div>
        <audio src="Michael Jackson - They Don't Care About Us.mp3" controls ></audio>
        <!-- 
        video tag ke saath jo 
        controls , src , autoplay , loop , muted jo the na , woh audio mein bhi kaam aayenge .......
        same function...
        
        agar koi video ya fir koi photo h na toh controls likhne ke baad hein woh dikhai dega :)-->
    </div>

    <!-- 
    IMP POINT TO NOTE :-
    
    preload attribute hota h audio tag ka and iske 3 values hein
    1.none
    2.metadata
    3.auto
  
    none:-
    iska matlab yeh h ki hum browser ko yeh bata rehe hein ki , ek audio agar h ... toh jaise hein user us website ko khole .... toh woh video ko download na kare kholte hien
    
    metadata:-
    iska matlab yeh h ki yeh bata ta h browser ko to fetch the data about the audio eg. audio length...

    auto:-
    jab hume browser ko bolna hota h ki jab ek user koi ek web page khole and automatically kholte hin audio download shuru ho jaye toh iska use kiya jaata h 
    -->
