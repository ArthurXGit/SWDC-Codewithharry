    <div id="first" class="red bg-yellow">loremi</div>

    <!-- 
    to access the class in css file , you have to write like this :
    
    .(class_name){}
    
    to access the id in the file to give colors , you have to write like this : 
     #(id_name){}  

     ID : yeh ek cheez hota h jisse ek particular cheez ki alag pehchan banti h 
     for example : aadhar card number is unique for all of the indian citizen

     CLASS : yeh ek cheez hota h jisme kuch cheezein iske under aati h

     for example : in MPA official discord server , kuch players humanplayer role ma aate hein .. kuch nitro boosters ki category mein
     kuch aate hien : 
     1. insane player category 
     2. intermediate player category
     3. map modder category mein

     and so on......
     aur ek user multiple roles mein aa sakta h 
     waise hein ek cheez alag alag classes ma aa sakta h :)

     ID and Classes are nothing but the attributes :)
    -->
</body>
